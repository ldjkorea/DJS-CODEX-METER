name: Verify beta Android contracts
on:
  push:
    branches: ['beta/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify beta contracts and reviewed content
        run: |
          python3 android/trial/run-beta-checks.py
          python3 android/trial/verify-beta9911-source.py
          python3 android/tests/verify-publication.py
          python3 android/tests/verify-public-source.py
      - name: Compile unsigned phone and lint
        working-directory: android
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0'
          test ! -e .local-signing
          bash gradlew :app:assembleRelease :app:lintRelease --no-daemon --console=plain
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      # The formal workflow/fixtures remain independent. No keys, publishing or signing here.
