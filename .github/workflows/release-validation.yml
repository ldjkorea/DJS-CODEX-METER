name: Verify release validation guards

on:
  push:
    branches: [main, 'qa/release-validation-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-source-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout public source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Offline guards after obtaining the existing JSON test dependency
        run: python3 android/tests/run-stable311-validation.py --focused
      # No Android SDK, Gradle/APK build, signing, device/login or release publishing.
      # Focused success does not certify the separate full historical workflow.
