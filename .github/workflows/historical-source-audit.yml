name: Historical source snapshots (separate audit)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Original full source snapshot suite (fails on unreviewed historical differences)
        run: bash android/run-tests.sh
      # No continue-on-error or snapshot rewriting. Separate from current production freeze.
